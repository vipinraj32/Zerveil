# Render Blueprint (Dashboard → New → Blueprint, pick this repo). One Docker web service; the database is your
# existing Render PostgreSQL (paste its Internal Database URL into DATABASE_URL).
# Deploys come from GitHub Actions (.github/workflows/ci.yml) after lint, tests and the image smoke test pass, through
# the service's deploy hook, so Render's own auto-deploy is off. Values marked sync: false are entered in the dashboard
# and never live in git.
services:
  - type: web
    name: zerveil
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      # required
      - key: PUBLIC_BASE_URL # https://<service>.onrender.com, also the Google OAuth redirect base
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ADMIN_EMAILS # Google accounts with the read-only operator views (no funds are held)
        sync: false
      # payments: simulated (no TAZ moves) | zcash (direct payments, real testnet scanning with zcash-devtool; see README)
      - key: PAYMENT_MODE
        value: simulated
      - key: ZCASH_NETWORK
        value: testnet
      # optional
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MCP_API_TOKEN
        sync: false
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGSMITH_API_KEY
        sync: false
      # PAYMENT_MODE=zcash only. This image does not contain zcash-devtool: PAYMENT_MODE=zcash needs an image that adds
      # the binary and a persistent disk for ZCASH_DEVTOOL_WALLET_DIR (see README, "Deployment").
      - key: ZCASH_LIGHTWALLETD_URL
        value: https://testnet.zec.rocks:443
      - key: ZCASH_DEVTOOL_WALLET_DIR
        sync: false
      - key: ZCASH_API_SELLER_UFVK
        sync: false
      - key: ZCASH_API_SELLER_BIRTHDAY
        sync: false
      - key: ZCASH_EXPLORER_TX_URL
        sync: false
